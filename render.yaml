databases:
  - name: fitmentor-db
    databaseName: fitmentor
    user: fitmentor
    plan: free

services:
  - type: web
    name: fitmentor-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_HOST
        fromDatabase:
          name: fitmentor-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: fitmentor-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: fitmentor-db
          property: database
      - key: DATABASE_USER
        fromDatabase:
          name: fitmentor-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: fitmentor-db
          property: password
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: PORT
        value: "8080"
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_SHARED_SECRET
        sync: false
