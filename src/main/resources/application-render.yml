# Production profile (Render). Schema ownership: FITMENTOR-BD/init.sql is the canonical schema.
# A byte-identical copy lives in db/schema.sql and is applied on every start (it is idempotent),
# so an empty database is initialized and an existing one is upgraded. Hibernate only validates
# the mapping against it and never alters tables.
spring:
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT:5432}/${DATABASE_NAME}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
  sql:
    init:
      mode: ${SCHEMA_INIT_MODE:always}
      platform: postgresql
      schema-locations: classpath:db/schema.sql
      # The script has DO $$ ... $$ blocks: send it as a single statement instead of splitting on ";".
      separator: "^^^ END OF SCRIPT ^^^"
      continue-on-error: false
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  # Render terminates TLS in a private proxy: trust its X-Forwarded-* headers (Tomcat RemoteIpValve
  # only trusts private addresses), so rate limits see the real client IP.
  forward-headers-strategy: native
ai:
  service-url: ${AI_SERVICE_URL:https://fitmentor-ai-drmr.onrender.com}
