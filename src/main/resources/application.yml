spring:
  application:
    name: fitmentor-backend
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:fitmentor;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
ai:
  service-url: ${AI_SERVICE_URL:http://localhost:8000}
fitmentor:
  jwt:
    secret: ${JWT_SECRET:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:*}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
