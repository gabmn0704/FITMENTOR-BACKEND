spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:fitmentor;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
  sql:
    init:
      mode: always
server:
  port: ${PORT:8080}
ai:
  service-url: ${AI_SERVICE_URL:http://localhost:8000}
