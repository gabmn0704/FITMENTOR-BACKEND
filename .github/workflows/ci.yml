name: Backend checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      # Real PostgreSQL 16 for PostgresIntegrationTests (render profile, schema.sql + validate).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fitmentor
          POSTGRES_USER: fitmentor
          POSTGRES_PASSWORD: fitmentor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitmentor -d fitmentor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify with the Maven wrapper
        run: ./mvnw --batch-mode --no-transfer-progress verify
        env:
          JWT_SECRET: ci-only-secret-with-more-than-32-characters
          FITMENTOR_TEST_PG_URL: jdbc:postgresql://127.0.0.1:5432/fitmentor
          FITMENTOR_TEST_PG_USER: fitmentor
          FITMENTOR_TEST_PG_PASSWORD: fitmentor
